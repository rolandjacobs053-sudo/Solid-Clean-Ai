crons:
  - name: recurring-cleans
    description: "Creates and charges the next visit of weekly, fortnightly and monthly residential cleans"
    cron: "0 7 * * *"
    timezone: "Europe/London"
    endpoint: "{{BASE_URL}}/api/cron/recurring"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
  - name: manager-daily-brief
    description: "AI Business Manager daily brief saved to the dashboard Reports tab"
    cron: "30 6 * * *"
    timezone: "Europe/London"
    endpoint: "{{BASE_URL}}/api/cron/manager-report/daily"
    method: POST
    enabled: true
  - name: manager-weekly-review
    description: "AI Business Manager weekly review every Monday, saved to the dashboard Reports tab"
    cron: "0 7 * * 1"
    timezone: "Europe/London"
    endpoint: "{{BASE_URL}}/api/cron/manager-report/weekly"
    method: POST
    enabled: true
  - name: manager-weekly-research
    description: "Weekly live web research on cleaning-industry topics (Perplexity, capped) added to the knowledge base; skipped if no key"
    cron: "0 5 * * 1"
    timezone: "Europe/London"
    endpoint: "{{BASE_URL}}/api/cron/manager-report/research"
    method: POST
    enabled: true
